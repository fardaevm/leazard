<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Upload your lease before you sign. See what's risky in 60 seconds.">
  <title>Leazard</title>
  <link rel="stylesheet" href="/ui/css/style.css">
  <script type="module" src="/ui/js/app.js"></script>
</head>
<body>
  <header class="site">
    <div class="wrap bar">
      <a class="brand" href="#/">Leazard</a>
      <nav id="nav" class="nav" aria-label="Account"></nav>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <dialog id="auth" aria-labelledby="auth-title">
    <form id="auth-form" class="stack" novalidate>
      <div class="stack tight">
        <h2 id="auth-title">Sign in to continue</h2>
        <p id="auth-sub" class="muted small">Your leases are saved privately to your account.</p>
      </div>
      <div>
        <label for="auth-user">Username</label>
        <input id="auth-user" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      </div>
      <div>
        <label for="auth-pass">Password</label>
        <input id="auth-pass" name="password" type="password" autocomplete="current-password" required aria-describedby="auth-pass-hint">
        <p id="auth-pass-hint" class="muted small hint" hidden>At least 6 characters.</p>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <button id="auth-submit" class="btn primary block" type="submit">Sign in</button>
      <div class="row between">
        <button id="auth-toggle" class="btn link" type="button">Create an account</button>
        <button id="auth-cancel" class="btn link" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
